name: Waveset
description: Waveset Technologies was a privately held identity-management software vendor based in
  Austin, Texas, and an early portfolio company of Lightspeed Venture Partners. Its flagship product,
  Lighthouse, automated user provisioning, password management, and identity brokering to govern access
  to enterprise systems and data. Sun Microsystems announced its acquisition of Waveset in 2003 and
  completed it in December 2003; the Lighthouse technology became the basis of Sun Identity Manager and
  was later carried into Oracle's identity portfolio. Waveset has not existed as an independent company
  since the acquisition and publishes no active website, developer portal, or API surface today.
